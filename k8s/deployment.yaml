apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-cart
  template:
    metadata:
      labels:
        app: ecommerce-cart
    spec:
      containers:
        - name: ecommerce-cart
          image: ecommerce-cart:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
